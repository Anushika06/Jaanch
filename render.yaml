# Render Blueprint (free tier). See docs/deployment.md for the full walkthrough.
# One web service runs the API, WhatsApp webhook, worker and (optionally) the web app.
# The database is Neon (Render's free Postgres expires after 30 days).
services:
  - type: web
    name: jaanch-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://jaanch-api.onrender.com
      - key: WEB_BASE_URL
        sync: false # e.g. https://jaanch.vercel.app (leave empty if Render also serves the web app)
      - key: DATABASE_URL
        sync: false # Neon connection string (direct, not -pooler), with sslmode=require
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      # WhatsApp via Meta's Cloud API. (For Twilio instead, set WHATSAPP_PROVIDER=twilio and the
      # TWILIO_* variables listed in .env.example.)
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_WA_ACCESS_TOKEN
        sync: false # system-user token (the API Setup page's temporary token expires within a day)
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WA_VERIFY_TOKEN
        generateValue: true # copy it into the app's webhook settings after the first deploy
      - key: INGEST_ON_BOOT
        value: auto
      - key: WORKER_CONCURRENCY
        value: '2'
